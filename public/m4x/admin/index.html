<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M4X Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><script src="../config.js"></script><style>
:root{--a:#00f0ff;--bg:#050505;--panel:#0b0b0b;--line:#242424;--muted:#888}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#071719,transparent 28%),#000;color:#eee;font-family:Inter,sans-serif}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px;position:sticky;top:0;height:100vh}.brand{font:700 18px 'JetBrains Mono';color:var(--a);margin-bottom:30px}.nav a{display:block;color:#aaa;text-decoration:none;padding:11px 12px;border-radius:9px;margin:4px 0}.nav a:hover{background:#111;color:#fff}.main{padding:28px;max-width:1100px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{font-size:25px;margin:0}.tag{font:11px 'JetBrains Mono';color:#00cc66;border:1px solid #173c29;padding:7px 10px;border-radius:99px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:rgba(10,10,10,.92);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.card h2{font:700 13px 'JetBrains Mono';color:var(--a);margin:0 0 16px;text-transform:uppercase}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;color:#888;font-size:11px;margin-bottom:7px}.field input,.field textarea{width:100%;background:#050505;border:1px solid #292929;border-radius:9px;color:#fff;padding:11px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#00f0ff}.product,.social{border:1px solid #202020;border-radius:12px;padding:14px;margin:10px 0;background:#070707}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:1px solid #333;background:#111;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none;font-size:12px}.primary{background:#fff;color:#000;border-color:#fff}.danger{color:#ff6262}.savebar{position:sticky;bottom:12px;background:rgba(5,5,5,.88);backdrop-filter:blur(12px);border:1px solid #282828;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{color:#777;font-size:11px}.toast{position:fixed;right:20px;bottom:80px;background:#0b2117;border:1px solid #175b38;color:#62ffa9;padding:11px 15px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s}.toast.on{opacity:1;transform:none}@media(max-width:760px){.shell{display:block}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:16px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.main{padding:16px}.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start}.savebar{bottom:8px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">M4X_ADMIN</div><nav class="nav"><a href="#profile">Hồ sơ</a><a href="#socials">Liên kết</a><a href="#products">Sản phẩm</a><a href="#payment">Thanh toán</a><a href="#appearance">Giao diện</a></nav></aside><main class="main"><div class="top"><div><h1>Control Center</h1><div class="hint">Chỉnh nội dung trang M4X_SYS</div></div><span class="tag">● LOCAL ADMIN</span></div>
<div class="grid"><section class="card" id="profile"><h2>Profile</h2><div class="field"><label>Tên hiển thị</label><input id="name"></div><div class="field"><label>Mô tả</label><textarea id="bio"></textarea></div><div class="row"><div class="field"><label>Chữ avatar</label><input id="avatarText"></div><div class="field"><label>URL avatar</label><input id="avatarUrl" placeholder="https://..."></div></div><div class="field"><label>System status</label><input id="status"></div></section>
<section class="card" id="appearance"><h2>Appearance & Music</h2><div class="row"><div class="field"><label>Accent</label><input id="accent" type="color"></div><div class="field"><label>Purple</label><input id="purple" type="color"></div></div><div class="field"><label>URL nhạc MP3</label><input id="music"></div></section></div>
<section class="card" id="socials"><h2>Social Links</h2><div id="socialList"></div><button onclick="addSocial()">+ Thêm liên kết</button></section>
<section class="card" id="products"><h2>Products</h2><div id="productList"></div><button onclick="addProduct()">+ Thêm sản phẩm</button></section>
<section class="card" id="payment"><h2>Payment</h2><div class="row"><div class="field"><label>Ngân hàng</label><input id="bank"></div><div class="field"><label>Số tài khoản</label><input id="account"></div></div><div class="field"><label>Chủ tài khoản</label><input id="bankName"></div><div class="field"><label>URL ảnh QR</label><input id="qr"></div></section>
<div class="savebar"><span class="hint">Lưu xong mở trang chính để xem thay đổi.</span><div class="actions"><a class="btn" href="../index.html" target="_blank">Xem web</a><button class="danger" onclick="resetAll()">Khôi phục</button><button class="primary" onclick="saveAll()">Lưu thay đổi</button></div></div></main></div><div class="toast" id="toast">Đã lưu cấu hình ✓</div><script>
let cfg=M4X.get(); const $=id=>document.getElementById(id);function esc(v=''){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function render(){name.value=cfg.profile.name;bio.value=cfg.profile.bio;avatarText.value=cfg.profile.avatarText;avatarUrl.value=cfg.profile.avatarUrl;status.value=cfg.profile.status;accent.value=cfg.theme.accent;purple.value=cfg.theme.purple;music.value=cfg.music.url;bank.value=cfg.bank.bank;account.value=cfg.bank.account;bankName.value=cfg.bank.name;qr.value=cfg.bank.qr;socialList.innerHTML=cfg.socials.map((s,i)=>`<div class="social"><div class="row"><div class="field"><label>Nhãn</label><input data-s="${i}" data-k="label" value="${esc(s.label)}"></div><div class="field"><label>Icon / Emoji</label><input data-s="${i}" data-k="icon" value="${esc(s.icon)}"></div></div><div class="field"><label>URL</label><input data-s="${i}" data-k="url" value="${esc(s.url)}"></div><button class="danger" onclick="delSocial(${i})">Xóa</button></div>`).join('');productList.innerHTML=cfg.products.map((p,i)=>`<div class="product"><div class="row"><div class="field"><label>Tên sản phẩm</label><input data-p="${i}" data-k="title" value="${esc(p.title)}"></div><div class="field"><label>Giá</label><input data-p="${i}" data-k="price" value="${esc(p.price)}"></div></div><div class="field"><label>Mô tả</label><textarea data-p="${i}" data-k="desc">${esc(p.desc)}</textarea></div><div class="row"><div class="field"><label>Icon</label><input data-p="${i}" data-k="icon" value="${esc(p.icon)}"></div><div class="field"><label>URL ảnh</label><input data-p="${i}" data-k="image" value="${esc(p.image||'')}"></div></div><div class="actions"><button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button><button class="danger" onclick="delProduct(${i})">Xóa</button></div></div>`).join('')}
function syncDynamic(){document.querySelectorAll('[data-s]').forEach(e=>cfg.socials[+e.dataset.s][e.dataset.k]=e.value);document.querySelectorAll('[data-p]').forEach(e=>cfg.products[+e.dataset.p][e.dataset.k]=e.value)}function addSocial(){syncDynamic();cfg.socials.push({icon:'🔗',label:'Link mới',url:'#'});render()}function delSocial(i){syncDynamic();cfg.socials.splice(i,1);render()}function addProduct(){syncDynamic();cfg.products.push({title:'Sản phẩm mới',price:'Liên hệ',desc:'Mô tả sản phẩm',icon:'📦',image:''});render()}function delProduct(i){syncDynamic();cfg.products.splice(i,1);render()}function move(i,d){syncDynamic();let j=i+d;if(j<0||j>=cfg.products.length)return;[cfg.products[i],cfg.products[j]]=[cfg.products[j],cfg.products[i]];render()}function saveAll(){syncDynamic();cfg.profile={name:name.value,bio:bio.value,avatarText:avatarText.value,avatarUrl:avatarUrl.value,status:status.value};cfg.theme={...cfg.theme,accent:accent.value,purple:purple.value};cfg.music.url=music.value;cfg.bank={bank:bank.value,account:account.value,name:bankName.value,qr:qr.value};M4X.save(cfg);toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1600)}function resetAll(){if(confirm('Khôi phục toàn bộ dữ liệu mặc định?')){M4X.reset();cfg=M4X.get();render()}}render();
</script></body></html>
